<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
  <img src="flex done.JPG" alt="Flexbox Image" class="Flexbox-image">
  <div class="card-content">
    <span class="card-tag">Design</span>
    <h3 class="card-title">Flexbox Layout</h3>
    <p class="card-description">Taking the frogs to their respectively lilypads using CSS.</p>
    <button class="btn btn-primary">View Project</button>
  </div>
</div>  
</body>
</html>
