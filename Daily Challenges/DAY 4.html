<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="contact-form">
  <div class="form-group">
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Florence" required>
  </div>
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="gitau0076@gmail.com" required>
  </div>
  <div class="form-group">
    <label for="message">Message</label>
    <textarea id="message" rows="4" placeholder="Take one step at time there is no hurray." required></textarea>
  </div>
  <button type="submit" class="btn btn-primary">Send Message</button>
</form>
</body>
</html>
